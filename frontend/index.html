<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Analytics Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f6ef7;
      --accent-hover: #6b85ff;
      --text: #e4e6f0;
      --text-muted: #7b80a0;
      --user-bubble: #1e3a5f;
      --agent-bubble: #1a1d27;
      --report-bg: #111827;
      --report-border: #1e40af;
      --red: #ef4444;
      --green: #22c55e;
      --yellow: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
    }
    .logo-text { font-size: 16px; font-weight: 600; }
    .logo-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .btn-new {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-new:hover { background: var(--border); }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Messages ── */
    .msg { display: flex; gap: 10px; max-width: 820px; }
    .msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .msg.agent { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.agent .avatar { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 680px;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border-radius: 14px 4px 14px 14px;
    }
    .msg.agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
    }

    /* ── Report card ── */
    .report-card {
      background: var(--report-bg);
      border: 1px solid var(--report-border);
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 820px;
      align-self: flex-start;
      width: 100%;
    }
    .report-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .report-body { font-size: 13.5px; line-height: 1.7; }
    .report-body h1 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .report-body h2 { font-size: 15px; margin: 16px 0 6px; color: #a5b4fc; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .report-body h3 { font-size: 13px; margin: 12px 0 4px; color: var(--text-muted); }
    .report-body p  { margin-bottom: 8px; }
    .report-body ul, .report-body ol { padding-left: 20px; margin-bottom: 8px; }
    .report-body li { margin-bottom: 4px; }
    .report-body strong { color: #c7d2fe; }
    .report-body table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
    .report-body th { background: var(--surface2); padding: 8px 12px; text-align: left; border: 1px solid var(--border); color: var(--text-muted); font-weight: 600; }
    .report-body td { padding: 7px 12px; border: 1px solid var(--border); }
    .report-body tr:nth-child(even) td { background: rgba(255,255,255,.02); }
    .report-body code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .report-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 4px; padding: 14px 16px; align-items: center; }
    .typing span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* ── Input area ── */
    footer {
      padding: 16px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      max-width: 820px;
      margin: 0 auto;
    }
    #input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color .15s;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--text-muted); }
    #send {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send:hover { background: var(--accent-hover); }
    #send:disabled { background: var(--border); cursor: not-allowed; }
    #send svg { width: 18px; height: 18px; fill: white; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      margin: auto;
      padding: 40px 20px;
    }
    .welcome-icon { font-size: 48px; margin-bottom: 16px; }
    .welcome h2 { font-size: 22px; margin-bottom: 8px; }
    .welcome p { color: var(--text-muted); font-size: 14px; max-width: 420px; margin: 0 auto 24px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .chip:hover { background: var(--border); border-color: var(--accent); }

    /* scrollbar */
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div>
      <div class="logo-text">Fraud Analytics Agent</div>
      <div class="logo-sub">Powered by GreenNode AgentBase</div>
    </div>
  </div>
  <button class="btn-new" onclick="newSession()">+ New conversation</button>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🔍</div>
    <h2>Fraud Analytics Agent</h2>
    <p>Ask me to generate fraud reports, analyze transaction patterns, or investigate specific fraud pillars.</p>
    <div class="chips">
      <div class="chip" onclick="send('Weekly fraud report for last week')">📊 Weekly report</div>
      <div class="chip" onclick="send('Analyze discount abuse for last week')">🏷️ Discount abuse</div>
      <div class="chip" onclick="send('Merchant abuse analysis for last month')">🏪 Merchant abuse</div>
      <div class="chip" onclick="send('Payment risk report for last week')">💳 Payment risk</div>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask for a fraud report…" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send" onclick="sendInput()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for new line</div>
</footer>

<script>
  // Empty = relative URL, so it calls /chat on the same server the page was loaded from.
  const ENDPOINT = '';

  let sessionId = null;
  let busy = false;

  const chat   = document.getElementById('chat');
  const input  = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function newSession() {
    sessionId = null;
    chat.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcome';
    w.innerHTML = document.querySelector('.welcome').innerHTML;
    chat.appendChild(w);
    input.value = '';
    input.style.height = '';
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendInput(); }
  }

  function sendInput() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    input.style.height = '';
    send(text);
  }

  async function send(text) {
    if (busy) return;
    hideWelcome();
    appendMessage('user', text);
    const typingEl = appendTyping();
    setBusy(true);

    try {
      const body = { message: text };
      if (sessionId) body.session_id = sessionId;

      const res = await fetch(`${ENDPOINT}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      sessionId = data.done ? null : data.session_id;

      clearInterval(typingEl._timer);
      typingEl.remove();

      if (data.report) appendReport(data.report);
      if (data.response) appendMessage('agent', data.response);
      if (data.done) appendMessage('agent', '');

    } catch (err) {
      clearInterval(typingEl._timer);
      typingEl.remove();
      appendMessage('agent', `⚠️ Error: ${err.message}. Please try again.`);
    }

    setBusy(false);
    scrollBottom();
  }

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function appendMessage(role, text) {
    if (!text) return;
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${escapeHtml(text)}</div>`;
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function appendReport(raw) {
    // Strip box-drawing lines and VALIDATION STATUS block for clean markdown
    const cleaned = raw
      .replace(/[═─]+\n?/g, '')
      .replace(/EXECUTIVE SUMMARY/g, '')
      .replace(/DETAILED ANALYST REPORT/g, '')
      .trim();

    const card = document.createElement('div');
    card.className = 'report-card';
    card.innerHTML = `
      <div class="report-label">📄 Fraud Analytics Report</div>
      <div class="report-body">${marked.parse(cleaned)}</div>`;
    chat.appendChild(card);
    scrollBottom();
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing"><span></span><span></span><span></span></div>
        <div id="elapsed" style="font-size:11px;color:var(--text-muted);margin-top:6px;">Analyzing… 0s</div>
      </div>`;
    chat.appendChild(div);
    scrollBottom();
    let secs = 0;
    div._timer = setInterval(() => {
      secs++;
      const el = div.querySelector('#elapsed');
      if (el) el.textContent = `Analyzing… ${secs}s`;
    }, 1000);
    return div;
  }

  function setBusy(val) {
    busy = val;
    sendBtn.disabled = val;
    input.disabled = val;
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
